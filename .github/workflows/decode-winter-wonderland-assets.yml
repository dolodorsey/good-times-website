name: Decode Winter Wonderland assets

on:
  push:
    branches: [main]
    paths:
      - 'events/winter-wonderland/assets/gallery-src/READY'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode sprite
        run: |
          mkdir -p events/winter-wonderland/assets/gallery
          cat events/winter-wonderland/assets/gallery-src/sprite-b/*.part | base64 --decode > events/winter-wonderland/assets/gallery/sprite-b.webp
          file events/winter-wonderland/assets/gallery/sprite-b.webp
      - name: Commit decoded asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events/winter-wonderland/assets/gallery/sprite-b.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Decode Winter Wonderland sprite B'
            git push
          fi
